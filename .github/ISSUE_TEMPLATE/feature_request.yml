name: 功能建议
description: 提出与家长/老师陪伴练习场景相关的改进
title: '[建议] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 谁在什么场景遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的改进
      description: 描述你希望的行为或界面。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关范围
      options:
        - 儿童练习体验
        - 家长或老师陪伴流程
        - 题库与题包
        - 可访问性或触摸操作
        - 开发体验或文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私范围
      options:
        - label: 该建议不要求公开儿童身份信息或上传私人题包。
          required: true
